<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseQueue Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e5e5e5; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 1.5rem; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 2rem; font-weight: 600; margin-top: 0.25rem; font-variant-numeric: tabular-nums; }
    .queued { color: #60a5fa; }
    .running { color: #fbbf24; }
    .success { color: #34d399; }
    .failed  { color: #f87171; }
    .dead_letter { color: #a78bfa; }

    #feed { max-height: 400px; overflow-y: auto; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1rem; }
    #feed:empty::after { content: "Waiting for job activity\2026"; color: #555; font-size: 0.8rem; }
    .event { font-size: 0.8rem; padding: 0.3rem 0; border-bottom: 1px solid #2a2a2a; font-family: ui-monospace, monospace; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-queued      { background: #60a5fa; }
    .dot-running     { background: #fbbf24; }
    .dot-success     { background: #34d399; }
    .dot-failed      { background: #f87171; }
    .dot-dead_letter { background: #a78bfa; }

    #connection-status { font-size: 0.75rem; color: #888; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>PulseQueue &mdash; Live Dashboard</h1>
  <div class="subtitle">Job status streamed over WebSocket from the Redis <code>pq:updates</code> channel.</div>
  <div id="connection-status">Connecting&hellip;</div>

  <div class="stats">
    <div class="stat-card"><div class="label">Queued</div><div class="value queued" id="s-queued">0</div></div>
    <div class="stat-card"><div class="label">Running</div><div class="value running" id="s-running">0</div></div>
    <div class="stat-card"><div class="label">Success</div><div class="value success" id="s-success">0</div></div>
    <div class="stat-card"><div class="label">Failed</div><div class="value failed" id="s-failed">0</div></div>
    <div class="stat-card"><div class="label">Dead Letter</div><div class="value dead_letter" id="s-dead_letter">0</div></div>
  </div>

  <div id="feed"></div>

  <script>
    const statusEl = document.getElementById('connection-status');
    const feedEl = document.getElementById('feed');
    const MAX_FEED_ENTRIES = 200;

    // --- Stats -----------------------------------------------------------
    // The WebSocket feed is the low-latency signal; GET /jobs/stats is the
    // authoritative one. Redis pub/sub has no delivery guarantee, so a dropped
    // message must not leave the counters permanently wrong -- every event
    // triggers a reconciling fetch.
    //
    // That fetch is debounced: under load the feed can deliver hundreds of
    // events per second, and one HTTP request each would put more load on the
    // API than the jobs themselves.
    let statsTimer = null;
    function scheduleStatsRefresh(delay = 300) {
      if (statsTimer) return;
      statsTimer = setTimeout(() => { statsTimer = null; refreshStats(); }, delay);
    }

    async function refreshStats() {
      try {
        const res = await fetch('/jobs/stats');
        if (!res.ok) return;
        const data = await res.json();
        for (const [key, val] of Object.entries(data)) {
          const el = document.getElementById(`s-${key}`);
          if (el) el.textContent = val;
        }
      } catch (err) {
        // Transient network failure; the next event schedules another attempt.
      }
    }

    // --- Live feed -------------------------------------------------------
    function appendEvent(jobId, status) {
      const entry = document.createElement('div');
      entry.className = 'event';
      const dot = document.createElement('span');
      dot.className = `status-dot dot-${status}`;
      entry.appendChild(dot);
      // textContent rather than innerHTML: job_id and status arrive over the
      // network, and building markup from network data is how XSS happens.
      entry.appendChild(document.createTextNode(
        `${new Date().toLocaleTimeString()} — job ${jobId.slice(0, 8)}… → ${status}`
      ));
      feedEl.prepend(entry);
      while (feedEl.childElementCount > MAX_FEED_ENTRIES) {
        feedEl.removeChild(feedEl.lastElementChild);
      }
    }

    // --- WebSocket with reconnect ----------------------------------------
    let reconnectDelay = 1000;

    function connect() {
      // wss:// when the page is served over HTTPS -- a hardcoded ws:// is
      // blocked as mixed content by every browser once this is deployed.
      const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${scheme}//${location.host}/jobs/stream`);

      ws.onopen = () => {
        statusEl.textContent = '● Connected';
        statusEl.style.color = '#34d399';
        reconnectDelay = 1000;
        refreshStats();
      };

      ws.onmessage = (event) => {
        const { job_id, status } = JSON.parse(event.data);
        appendEvent(job_id, status);
        scheduleStatsRefresh();
      };

      ws.onclose = () => {
        statusEl.textContent = `○ Disconnected — reconnecting in ${reconnectDelay / 1000}s`;
        statusEl.style.color = '#f87171';
        // Exponential backoff, capped. An API restart should not leave a
        // recruiter looking at a dead page.
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 15000);
      };

      ws.onerror = () => ws.close();
    }

    refreshStats();
    connect();
  </script>
</body>
</html>

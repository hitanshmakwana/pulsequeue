# PulseQueue — full local stack.
#
#   docker compose up --build
#
# Brings up Postgres, Redis, the API, three worker replicas, Prometheus
# (scraping /metrics every 5s), and Grafana (pre-loaded dashboard).
#
#   API:        http://localhost:8000
#   Dashboard:  http://localhost:8000/dashboard/
#   Metrics:    http://localhost:8000/metrics
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin / admin)
#
# No top-level `version:` key — it has been obsolete since Compose v2 and only
# produces a warning.
#
# Host ports are overridable so this file works on a machine that already has
# something on 5432/6379/8000. Set POSTGRES_PORT / REDIS_PORT / API_PORT in a
# local .env to remap; the defaults below are what a fresh clone gets, and the
# container-to-container addresses never change either way.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulsequeue
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Gates dependent services: they will not start until Postgres actually
      # accepts connections, rather than merely having a running container.
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulsequeue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulsequeue
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      # Multiprocess metrics: API aggregates worker metrics from this volume.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - prometheus_data:/tmp/prometheus_multiproc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulsequeue
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      VISIBILITY_TIMEOUT: 60
      RECOVERY_INTERVAL: 15
      # Multiprocess metrics: workers write to this shared volume.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - prometheus_data:/tmp/prometheus_multiproc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      replicas: 3
    stop_grace_period: 30s
    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"  # allows hot reload via POST /-/reload
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-provision the Prometheus datasource and the PulseQueue dashboard.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
  prometheus_data:

